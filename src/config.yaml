# WhisperWriter configuration.
# Overlays the defaults in config_schema.yaml, which documents every option.
#
# This file is tracked in git, unlike upstream, because the settings window
# rewrites it wholesale on Save - history is the only way back from a mistake.
# The values below are a working setup, not a universal one: check the model,
# device and language before assuming they suit your machine.

model_options:
  use_api: false            # false = local model: free, offline, nothing leaves the machine
  common:
    language: ru            # ISO-639-1 code of the language being dictated
    # A vocabulary prompt was measured on real speech and dropped: large-v3
    # already writes faster-whisper, Whisper and OpenAI correctly, and the
    # prompt cost a lost word. Add terms here only if a specific one keeps
    # coming out wrong.
    initial_prompt: null
  local:
    model: large-v3         # on a GPU this beats small on the CPU for both speed and accuracy
    device: cuda            # cuda, cpu or auto; a GPU that cannot run falls back to the CPU at startup
    compute_type: int8_float32   # cards without usable float16 - Pascal and older - want int8
    condition_on_previous_text: false   # fewer repetition loops when dictating
    vad_filter: true        # drop silence before transcribing

recording_options:
  activation_key: pause   # a single key: clear of Ctrl+Shift, Alt+Shift and the whole Win+Space family
  recording_mode: voice_activity_detection   # press to start; a pause in speech ends it
  sample_rate: 16000
  silence_duration: 2000    # pause in speech that ends a recording, ms
  min_duration: 100

post_processing:
  add_trailing_space: true
  remove_trailing_period: false

misc:
  ui_language: ru   # interface language: en or ru; unrelated to what is dictated
  print_to_terminal: true
  hide_status_window: false
  noise_on_completion: false

security:
  mic_gate: both   # microphone stays shut, opening only for the length of a dictation
