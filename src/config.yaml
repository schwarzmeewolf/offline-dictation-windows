# Пользовательская конфигурация WhisperWriter
# Накладывается поверх значений по умолчанию из config_schema.yaml

model_options:
  use_api: false            # false = локальная модель (бесплатно, без интернета)
  common:
    language: ru            # русский язык распознавания
    initial_prompt: null
  local:
    model: small            # tiny/base/small/medium/large-v3 — баланс точность/скорость
    device: cpu             # cpu — надёжно; для GPU нужны библиотеки CUDA (см. ниже)
    compute_type: int8      # int8 — быстро на CPU
    condition_on_previous_text: false   # меньше зацикливаний при диктовке
    vad_filter: true        # обрезать тишину

recording_options:
  activation_key: pause   # одиночная клавиша: мимо Ctrl+Shift (язык), Alt+Shift (раскладка) и Win+Space (системный переключатель ввода)
  recording_mode: voice_activity_detection   # нажал — пишет; пауза в речи — авто-стоп и распознавание
  sample_rate: 16000
  silence_duration: 2000    # пауза в речи, после которой запись закрывается и идёт распознавание
  min_duration: 100

post_processing:
  add_trailing_space: true
  remove_trailing_period: false

misc:
  print_to_terminal: true
  hide_status_window: false
  noise_on_completion: false

security:
  mic_gate: both   # микрофон закрыт всегда, открывается только на время диктовки
